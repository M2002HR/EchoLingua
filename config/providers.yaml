tts:
  fake:
    enabled: true
    provider: fake
    priority: 10
    voices:
      fa: fake-fa
      fr: fake-fr
    default_voice: fake-neutral
  edge:
    enabled: false
    provider: edge
    priority: 20
    # Useful Edge voice options you can switch between in recipes:
    # Persian male-ish alternatives:
    #   fa-IR-FaridNeural
    # Persian female alternatives:
    #   fa-IR-DilaraNeural
    # French male alternatives:
    #   fr-FR-HenriNeural
    #   fr-CA-ThierryNeural
    # French female alternatives:
    #   fr-FR-DeniseNeural
    #   fr-FR-EloiseNeural
    #   fr-CA-SylvieNeural
    # English male alternatives:
    #   en-US-ChristopherNeural
    #   en-GB-RyanNeural
    # English female alternatives:
    #   en-US-AriaNeural
    #   en-US-JennyNeural
    #   en-GB-SoniaNeural
    voices:
      fa: fa-IR-DilaraNeural
      fa_male: fa-IR-FaridNeural
      fa_female: fa-IR-DilaraNeural
      fr: fr-FR-DeniseNeural
      fr_male: fr-FR-HenriNeural
      fr_female: fr-FR-DeniseNeural
      en: en-US-JennyNeural
      en_male: en-US-ChristopherNeural
      en_female: en-US-JennyNeural
    default_voice: fr-FR-DeniseNeural
  piper:
    enabled: false
    provider: piper
    priority: 30
    model_path: models/piper/fr_FR-upmc-medium.onnx
    config_path: models/piper/fr_FR-upmc-medium.onnx.json
    voices:
      fr: fr_FR-upmc-medium
      en: en_US-lessac-medium
    default_voice: fr_FR-upmc-medium
  ajil:
    enabled: false
    provider: ajil
    priority: 40
    base_url: http://127.0.0.1:8090
    route: /v1/tts
    voices:
      fr: ajil-fr-default
      en: ajil-en-default
    default_voice: ajil-fr-default
