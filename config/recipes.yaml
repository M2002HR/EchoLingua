recipes:
  shadowing_basic:
    description: "Basic shadowing: Persian prompt, pause, French target, repeat."
    output_format: mp3
    provider_policy:
      tts:
        strategy: priority
        default_provider: fake
        allow_fallback_on_error: true
    segments:
      - kind: tts
        text_field: persian
        language: fa
      - kind: silence
        duration_ms: 900
      - kind: tts
        text_field: french
        language: fr
      - kind: silence
        duration_ms: 600
      - kind: tts
        text_field: french
        language: fr
  active_recall:
    description: "Persian prompt with longer recall pause before French answer."
    output_format: mp3
    provider_policy:
      tts:
        strategy: priority
        default_provider: fake
        allow_fallback_on_error: true
    segments:
      - kind: tts
        text_field: persian
        language: fa
      - kind: silence
        duration_ms: 2500
      - kind: tts
        text_field: french
        language: fr
      - kind: silence
        duration_ms: 700
  english_then_target:
    description: "English reference first, then French target twice."
    output_format: mp3
    provider_policy:
      tts:
        strategy: priority
        default_provider: fake
        allow_fallback_on_error: true
    segments:
      - kind: tts
        text_field: english
        language: en
      - kind: silence
        duration_ms: 1200
      - kind: tts
        text_field: target
        language: fr
        rate: "-20%"
      - kind: silence
        duration_ms: 1200
      - kind: tts
        text_field: target
        language: fr
      - kind: silence
        duration_ms: 3000
  persian_prompt_french_ladder:
    description: "Persian prompt, French normal male, French word-by-word with pauses, French slower, then French normal."
    output_format: mp3
    provider_policy:
      tts:
        strategy: explicit
        explicit_provider: edge
        default_provider: edge
        allow_fallback_on_error: false
    segments:
      - kind: tts
        text_field: persian
        language: fa
        voice: fa-IR-DilaraNeural
      - kind: silence
        duration_ms: 3000
      - kind: tts
        text_field: french
        language: fr
        voice: fr-FR-HenriNeural
        rate: "+0%"
      - kind: silence
        duration_ms: 3000
      - kind: tts
        text_field: french
        language: fr
        voice: fr-FR-HenriNeural
        split_words: true
        word_pause_ms: 900
      - kind: silence
        duration_ms: 3000
      - kind: tts
        text_field: french
        language: fr
        voice: fr-FR-HenriNeural
        rate: "-20%"
      - kind: silence
        duration_ms: 3000
      - kind: tts
        text_field: french
        language: fr
        voice: fr-FR-HenriNeural
        rate: "+0%"
