[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echolingua"
version = "0.1.0"
description = "Provider-based language-learning audio pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "pydub>=0.25",
  "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
edge = ["edge-tts>=6.1"]
dev = ["pytest>=8.0"]

[project.scripts]
echolingua = "echolingua.cli:app"
echolingua-bot = "echolingua.telegram_bot.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["echolingua*"]
